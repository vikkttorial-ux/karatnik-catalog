name: Каталог — публикация
on:
  push:
    branches: [main]
    paths: [catalog-bundle.zip, .github/workflows/publish.yml, '.refresh/request.json', 'refresh/**']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: catalog-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Распаковать каталог
        run: python -m zipfile -e catalog-bundle.zip .
      - name: Подготовить чтение источников
        run: python -m pip install 'google-auth>=2,<3' 'requests>=2,<3'
      - uses: actions/cache/restore@v4
        with:
          path: refresh-cache
          key: catalog-source-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: catalog-source-
      - name: Прочитать таблицы и проверить данные
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python -m unittest discover -s refresh -p 'test_*.py'
          python refresh/run.py
      - name: Проверить публикуемые файлы
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from catalog import scan_site, validate_catalog
          data = json.loads(Path('site/data.json').read_text(encoding='utf-8'))
          validate_catalog(data, sum(item['units'] for item in data['items']))
          scan_site('site')
          PY
      - name: Подготовить новую версию отчёта
        run: python refresh/run.py --stage
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Опубликовать
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Активировать согласованную версию отчёта
        run: python refresh/run.py --commit
      - uses: actions/cache/save@v4
        with:
          path: refresh-cache
          key: catalog-source-${{ github.run_id }}-${{ github.run_attempt }}
